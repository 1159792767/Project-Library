name: Publish desktop demo
on: [workflow_dispatch]
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project tests/Updater.Tests.csproj
      - name: Build and publish both demo versions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          foreach ($v in @('1.1.0','1.1.1')) {
            $lib = if ($v -eq '1.1.0') { '1.0.0' } else { '1.0.1' }
            $text = Get-Content -Raw Demo.App.csproj
            $text = $text -replace '<Version>[^<]+</Version>', "<Version>$v</Version>"
            $text = $text -replace 'Version="1.0.[01]"', "Version=`"$lib`""
            Set-Content Demo.App.csproj $text
            dotnet publish Demo.App.csproj -c Release -r win-x64 --self-contained true -o "publish/$v"
            if ($LASTEXITCODE -ne 0) { throw 'Publish failed' }
            $proc = Start-Process "publish/$v/Demo.App.exe" -ArgumentList '--self-test' -Wait -PassThru -WindowStyle Hidden
            $expected = if ($v -eq '1.1.0') { 1 } else { 0 }
            if ($proc.ExitCode -ne $expected) { throw "Unexpected calculation result $v" }
            Compress-Archive -Path "publish/$v/*" -DestinationPath "Demo.App-$v-win-x64.zip"
            $hash = (Get-FileHash "Demo.App-$v-win-x64.zip" -Algorithm SHA256).Hash
            @{version=$v;url="https://github.com/1159792767/Project-Library/releases/download/v$v/Demo.App-$v-win-x64.zip";sha256=$hash} | ConvertTo-Json | Set-Content update.json
            gh release create "v$v" "Demo.App-$v-win-x64.zip" update.json --target $env:GITHUB_SHA --title "Desktop updater demo $v" --notes "Windows x64 desktop demo. Download the ZIP asset, extract all files and open Demo.App.exe. Version 1.1.0 demonstrates the bug; check for updates to install 1.1.1."
            if ($LASTEXITCODE -ne 0) { throw 'Release failed' }
          }
